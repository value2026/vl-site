# ============================================================
# Virtual Labs — Docker Compose (Production)
# ============================================================
# Usage:
#   docker-compose up -d --build
#   docker-compose down
#   docker-compose logs -f
# ============================================================

version: "3.9"

services:

  # ── PostgreSQL Database ─────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: vl-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vluser
      POSTGRES_PASSWORD: vlpassword
      POSTGRES_DB: virtuallabs_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vluser -d virtuallabs_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vl-network

  # ── Node.js Backend ─────────────────────────────────────────
  backend:
    build:
      context: ./vl-backend
      dockerfile: Dockerfile
    container_name: vl-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://vluser:vlpassword@db:5432/virtuallabs_db
      JWT_SECRET: ${JWT_SECRET:-vl-super-secret-change-this-in-production}
      PORT: 5000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "5000:5000"
    volumes:
      # Persist uploaded files (experiment content, etc.)
      - uploads_data:/app/uploads
      # Persist logs to the host machine so they can be viewed locally
      - ./vl-backend/logs:/app/logs
    networks:
      - vl-network

  # ── React Frontend ──────────────────────────────────────────
  frontend:
    build:
      context: ./vl-app
      dockerfile: Dockerfile
    container_name: vl-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:5000/api
    ports:
      - "5173:5173"
    volumes:
      - ./vl-app:/app
      - /app/node_modules
    networks:
      - vl-network

# ── Volumes ──────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

# ── Network ───────────────────────────────────────────────────
networks:
  vl-network:
    driver: bridge
