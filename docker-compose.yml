# ============================================================
# Virtual Labs — Docker Compose (Production)
# ============================================================
# Usage:
#   docker-compose up -d --build
#   docker-compose down
#   docker-compose logs -f
# ============================================================

version: "3.9"

services:

  # ── PostgreSQL Database ─────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: vl-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vluser -d virtuallabs_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Node.js Backend ─────────────────────────────────────────
  backend:
    build:
      context: ./vl-backend
      dockerfile: Dockerfile
    container_name: vl-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 5000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      GA_PROPERTY_ID: ${GA_PROPERTY_ID:-}
      GA_CLIENT_EMAIL: ${GA_CLIENT_EMAIL:-}
      GA_PRIVATE_KEY: ${GA_PRIVATE_KEY:-}
    ports:
      - "5000:5000"
    volumes:
      # Use local Windows uploads directory directly so Docker and local dev share files
      - ./vl-backend/uploads:/app/uploads
      # Persist logs to the host machine so they can be viewed locally
      - ./vl-backend/logs:/app/logs

  # ── React Frontend (Nginx + Production Build) ────────────────
  frontend:
    build:
      context: ./vl-app
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_FILES_URL: ${VITE_FILES_URL:-/files}
        VITE_SOCKET_PATH: ${VITE_SOCKET_PATH:-/socket.io}
        VITE_GA_MEASUREMENT_ID: ${VITE_GA_MEASUREMENT_ID:-}
    container_name: vl-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

# ── Volumes ──────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
