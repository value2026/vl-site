# ============================================================
# Virtual Labs — Docker Compose (Production)
# ============================================================
# Usage:
#   docker-compose up -d --build
#   docker-compose down
#   docker-compose logs -f
# ============================================================


services:

  # ── PostgreSQL Database ─────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: vl-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vluser
      POSTGRES_PASSWORD: vlpassword
      POSTGRES_DB: virtuallabs_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vluser -d virtuallabs_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Node.js Backend ─────────────────────────────────────────
  backend:
    build:
      context: ./vl-backend
      dockerfile: Dockerfile
    container_name: vl-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://vluser:vlpassword@db:5432/virtuallabs_db
      JWT_SECRET: ${JWT_SECRET:-vl-super-secret-change-this-in-production}
      PORT: 5000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: "anandik44@gmail.com"
      SMTP_PASS: "vwdbmldxufjapety"
      SMTP_FROM: '"Virtual Labs Admin" <anandik44@gmail.com>'
    ports:
      - "5000:5000"
    volumes:
      # Use local Windows uploads directory directly so Docker and local dev share files
      - ./vl-backend/uploads:/app/uploads
      # Persist logs to the host machine so they can be viewed locally
      - ./vl-backend/logs:/app/logs

  # ── React Frontend (Nginx + Production Build) ────────────────
  frontend:
    build:
      context: ./vl-app
      dockerfile: Dockerfile
    container_name: vl-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

# ── Volumes ──────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
