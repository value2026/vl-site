# Enable required modules first:
#   a2enmod proxy proxy_http proxy_wstunnel headers rewrite

<VirtualHost *:443>
    ServerName vlab.amrita.edu

    # Existing SSLEngine / SSLCertificateFile / SSLCertificateKeyFile stay here.

    ProxyPreserveHost On
    ProxyRequests Off

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host "vlab.amrita.edu"
    RequestHeader set X-Forwarded-Prefix "/v2"

    RewriteEngine On
    RewriteRule ^/v2$ /v2/ [R=301,L]

    ProxyPass        /v2/socket.io/  ws://10.0.0.69/socket.io/ retry=0 timeout=300
    ProxyPassReverse /v2/socket.io/  ws://10.0.0.69/socket.io/

    ProxyPass        /v2/  http://10.0.0.69/ retry=0 timeout=300
    ProxyPassReverse /v2/  http://10.0.0.69/
</VirtualHost>
