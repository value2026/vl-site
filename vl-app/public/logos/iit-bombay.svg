<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="iitb-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E40AF" />
    </radialGradient>
  </defs>
  
  <!-- Outer Cog Gear -->
  <g fill="#1E40AF">
    <!-- 16 cog teeth -->
    <rect x="76" y="4" width="8" height="12" rx="2" />
    <rect x="76" y="4" width="8" height="12" rx="2" transform="rotate(22.5 80 80)" />
    <rect x="76" y="4" width="8" height="12" rx="2" transform="rotate(45 80 80)" />
    <rect x="76" y="4" width="8" height="12" rx="2" transform="rotate(67.5 80 80)" />
    <rect x="76" y="4" width="8" height="12" rx="2" transform="rotate(90 80 80)" />
    <rect x="76" y="4" width="8" height="12" rx="2" transform="rotate(112.5 80 80)" />
    <rect x="76" y="4" width="8" height="12" rx="2" transform="rotate(135 80 80)" />
    <rect x="76" y="4" width="8" height="12" rx="2" transform="rotate(157.5 80 80)" />
    <rect x="76" y="4" width="8" height="12" rx="2" transform="rotate(180 80 80)" />
    <rect x="76" y="4" width="8" height="12" rx="2" transform="rotate(202.5 80 80)" />
    <rect x="76" y="4" width="8" height="12" rx="2" transform="rotate(225 80 80)" />
    <rect x="76" y="4" width="8" height="12" rx="2" transform="rotate(247.5 80 80)" />
    <rect x="76" y="4" width="8" height="12" rx="2" transform="rotate(270 80 80)" />
    <rect x="76" y="4" width="8" height="12" rx="2" transform="rotate(292.5 80 80)" />
    <rect x="76" y="4" width="8" height="12" rx="2" transform="rotate(315 80 80)" />
    <rect x="76" y="4" width="8" height="12" rx="2" transform="rotate(337.5 80 80)" />
  </g>

  <!-- Main circular body -->
  <circle cx="80" cy="80" r="70" fill="url(#iitb-grad)" />
  <circle cx="80" cy="80" r="66" fill="none" stroke="#93C5FD" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.6" />
  <circle cx="80" cy="80" r="58" fill="#1D4ED8" stroke="#DBEAFE" stroke-width="2" />
  
  <!-- Temple spire / Kalasha / Torch of Knowledge -->
  <!-- Base book -->
  <path d="M56 108 Q80 114 104 108 L104 116 Q80 122 56 116 Z" fill="#FFFFFF" />
  <path d="M58 110 Q80 116 102 110" stroke="#1E40AF" stroke-width="1.5" fill="none" />
  <line x1="80" y1="113" x2="80" y2="119" stroke="#1E40AF" stroke-width="1.5" />

  <!-- Inner Cog & Torch -->
  <circle cx="80" cy="82" r="19" fill="#1E3A8A" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="80" cy="82" r="8" fill="#FFFFFF" />
  <circle cx="80" cy="82" r="4" fill="#1E3A8A" />

  <!-- Spire Tower / Flame -->
  <path d="M74 62 L80 40 L86 62 Z" fill="#FFFFFF" />
  <path d="M77 62 L80 46 L83 62 Z" fill="#93C5FD" />
  <circle cx="80" cy="38" r="3.5" fill="#FDE047" stroke="#FFFFFF" stroke-width="1" />

  <!-- Side wings / gear elements -->
  <path d="M50 78 Q60 74 68 78 L68 86 Q60 82 50 86 Z" fill="#FFFFFF" opacity="0.9" />
  <path d="M110 78 Q100 74 92 78 L92 86 Q100 82 110 86 Z" fill="#FFFFFF" opacity="0.9" />

  <!-- Top arc text representation -->
  <path id="topArc" d="M 36,80 A 44,44 0 0,1 124,80" fill="none" />
  <text font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="bold" fill="#FFFFFF" letter-spacing="1.2">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">
      IIT BOMBAY
    </textPath>
  </text>

  <!-- Bottom motto text representation -->
  <path id="botArc" d="M 36,80 A 44,44 0 0,0 124,80" fill="none" />
  <text font-family="system-ui, -apple-system, sans-serif" font-size="6" font-weight="600" fill="#BFDBFE" letter-spacing="0.5">
    <textPath href="#botArc" startOffset="50%" text-anchor="middle">
      ज्ञानं परमं ध्येयम्
    </textPath>
  </text>
</svg>
