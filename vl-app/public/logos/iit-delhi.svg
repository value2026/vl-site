<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="iitd-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7E22CE" />
      <stop offset="100%" stop-color="#581C87" />
    </radialGradient>
  </defs>

  <!-- Outer Cog Gear -->
  <g fill="#581C87">
    <rect x="76" y="4" width="8" height="12" rx="2" />
    <rect x="76" y="4" width="8" height="12" rx="2" transform="rotate(22.5 80 80)" />
    <rect x="76" y="4" width="8" height="12" rx="2" transform="rotate(45 80 80)" />
    <rect x="76" y="4" width="8" height="12" rx="2" transform="rotate(67.5 80 80)" />
    <rect x="76" y="4" width="8" height="12" rx="2" transform="rotate(90 80 80)" />
    <rect x="76" y="4" width="8" height="12" rx="2" transform="rotate(112.5 80 80)" />
    <rect x="76" y="4" width="8" height="12" rx="2" transform="rotate(135 80 80)" />
    <rect x="76" y="4" width="8" height="12" rx="2" transform="rotate(157.5 80 80)" />
    <rect x="76" y="4" width="8" height="12" rx="2" transform="rotate(180 80 80)" />
    <rect x="76" y="4" width="8" height="12" rx="2" transform="rotate(202.5 80 80)" />
    <rect x="76" y="4" width="8" height="12" rx="2" transform="rotate(225 80 80)" />
    <rect x="76" y="4" width="8" height="12" rx="2" transform="rotate(247.5 80 80)" />
    <rect x="76" y="4" width="8" height="12" rx="2" transform="rotate(270 80 80)" />
    <rect x="76" y="4" width="8" height="12" rx="2" transform="rotate(292.5 80 80)" />
    <rect x="76" y="4" width="8" height="12" rx="2" transform="rotate(315 80 80)" />
    <rect x="76" y="4" width="8" height="12" rx="2" transform="rotate(337.5 80 80)" />
  </g>

  <!-- Main circular body -->
  <circle cx="80" cy="80" r="70" fill="url(#iitd-grad)" />
  <circle cx="80" cy="80" r="66" fill="none" stroke="#D8B4FE" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.6" />
  <circle cx="80" cy="80" r="58" fill="#6B21A8" stroke="#F3E8FF" stroke-width="2" />

  <!-- Lotus / Base motif -->
  <path d="M52 108 C64 100 74 104 80 114 C86 104 96 100 108 108 C98 120 62 120 52 108 Z" fill="#FFFFFF" opacity="0.9" />
  
  <!-- Intersecting Atom Orbit Rings -->
  <ellipse cx="80" cy="74" rx="28" ry="11" fill="none" stroke="#FFFFFF" stroke-width="2" transform="rotate(0 80 74)" />
  <ellipse cx="80" cy="74" rx="28" ry="11" fill="none" stroke="#E9D5FF" stroke-width="2" transform="rotate(60 80 74)" />
  <ellipse cx="80" cy="74" rx="28" ry="11" fill="none" stroke="#C084FC" stroke-width="2" transform="rotate(120 80 74)" />

  <!-- Nucleus / Core -->
  <circle cx="80" cy="74" r="5.5" fill="#FDE047" stroke="#FFFFFF" stroke-width="1.5" />

  <!-- Top arc text representation -->
  <path id="iitdTopArc" d="M 36,80 A 44,44 0 0,1 124,80" fill="none" />
  <text font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="bold" fill="#FFFFFF" letter-spacing="1.2">
    <textPath href="#iitdTopArc" startOffset="50%" text-anchor="middle">
      IIT DELHI
    </textPath>
  </text>

  <!-- Bottom motto text -->
  <path id="iitdBotArc" d="M 36,80 A 44,44 0 0,0 124,80" fill="none" />
  <text font-family="system-ui, -apple-system, sans-serif" font-size="6" font-weight="600" fill="#E9D5FF" letter-spacing="0.5">
    <textPath href="#iitdBotArc" startOffset="50%" text-anchor="middle">
      तपसो न परं किञ्चित्
    </textPath>
  </text>
</svg>
